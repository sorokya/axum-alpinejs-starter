pre-commit:
  parallel: true
  jobs:
    - run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      glob: "*.{js,ts,jsx,tsx,json,css,md}"

    - run: cargo fmt -- --check
      glob: "*.rs"

    - run: cargo clippy -- -D warnings
      glob: "*.rs"
